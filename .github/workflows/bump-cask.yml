name: Bump julide cask

# JulIde's release workflow publishes a *draft* release that a maintainer then
# publishes by hand, so polling for the latest published release is the right trigger.
# Run the workflow manually to pick up a release without waiting for the next tick.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  TAP: julideorg/tap

jobs:
  bump:
    # macOS, because the bumped cask is smoke-tested with a real `brew install` before
    # it is pushed. A push made with GITHUB_TOKEN does not trigger ci.yml, so verifying
    # here is the only thing standing between a bad bump and `brew install` users.
    runs-on: macos-latest
    steps:
      # Checks the tap out into Library/Taps and symlinks it to the workspace, so the
      # working directory below is both the git repo and what brew reads the cask from.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Bump the cask to the latest release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bump-julide.sh

      # Cask only — see the comment in ci.yml for why this is not `brew style "$TAP"`.
      - name: brew style (cask)
        if: steps.bump.outputs.bumped == 'true'
        run: brew style "$TAP/julide"

      - name: Smoke-test the bumped cask
        if: steps.bump.outputs.bumped == 'true'
        run: |
          brew install --cask "$TAP/julide"
          test -d /Applications/julide.app
          if xattr -r -l /Applications/julide.app | grep -q com.apple.quarantine; then
            echo "::error::com.apple.quarantine survived on /Applications/julide.app"
            exit 1
          fi
          brew uninstall --cask julide

      - name: Commit and push
        if: steps.bump.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -am "julide ${{ steps.bump.outputs.version }}"
          git push origin HEAD:refs/heads/main
