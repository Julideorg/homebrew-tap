name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAP: julideorg/tap

jobs:
  lint:
    name: brew style & audit
    runs-on: macos-latest
    steps:
      # This also checks the tap out into Homebrew's Library/Taps at GITHUB_SHA and
      # symlinks it to the workspace, so no actions/checkout step is wanted here —
      # adding one fights it for the same path and the job dies before it starts.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      # Scoped to the cask on purpose. `brew style "$TAP"` would also run shfmt over
      # scripts/ using Homebrew's internal house style, which is neither documented nor
      # stable across brew releases (the stable brew wants `then` on its own line; the
      # flags in master's style.rb produce the opposite). The script is linted below
      # with plain shellcheck and shfmt instead, which is reproducible locally.
      - name: brew style (cask)
        run: brew style "$TAP/julide"

      - name: shellcheck & shfmt (scripts)
        run: |
          brew install --quiet shellcheck shfmt
          shellcheck --enable=all scripts/bump-julide.sh
          shfmt --diff scripts/bump-julide.sh

      # Passes clean today, including the legacy `postflight` block that julIDE needs
      # for as long as it ships unsigned, so this is a required check. `always()` so a
      # style failure does not hide audit findings.
      - name: brew audit
        if: always()
        run: brew audit --cask --online "$TAP/julide"

  install:
    name: install smoke test
    # macos-latest is arm64, so this exercises the Apple Silicon branch of the cask.
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: brew install --cask julide
        run: brew install --cask "$TAP/julide"

      - name: App is installed and de-quarantined
        run: |
          test -d /Applications/julide.app
          if xattr -r -l /Applications/julide.app | grep -q com.apple.quarantine; then
            echo "::error::com.apple.quarantine survived on /Applications/julide.app"
            exit 1
          fi
          echo "julide.app installed with no quarantine attribute"

      - name: brew uninstall --cask julide
        run: brew uninstall --cask julide
