name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAP: julideorg/tap

jobs:
  lint:
    name: brew style & audit
    runs-on: macos-latest
    steps:
      # This also checks the tap out into Homebrew's Library/Taps at GITHUB_SHA and
      # symlinks it to the workspace, so no actions/checkout step is wanted here —
      # adding one fights it for the same path and the job dies before it starts.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: brew style
        run: brew style "$TAP"

      # Advisory: some audit rules only apply to casks hosted in homebrew/cask —
      # notably the rejection of legacy `postflight` blocks, which julIDE needs for as
      # long as it ships unsigned. Tighten this to a required check once we know which
      # findings we can actually clear.
      - name: brew audit
        continue-on-error: true
        run: brew audit --cask --online "$TAP/julide"

  install:
    name: install smoke test
    # macos-latest is arm64, so this exercises the Apple Silicon branch of the cask.
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: brew install --cask julide
        run: brew install --cask "$TAP/julide"

      - name: App is installed and de-quarantined
        run: |
          test -d /Applications/julide.app
          if xattr -r -l /Applications/julide.app | grep -q com.apple.quarantine; then
            echo "::error::com.apple.quarantine survived on /Applications/julide.app"
            exit 1
          fi
          echo "julide.app installed with no quarantine attribute"

      - name: brew uninstall --cask julide
        run: brew uninstall --cask julide
